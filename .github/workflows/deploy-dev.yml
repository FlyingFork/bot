name: Deploy Dev Website

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=@tiles-survive/web

      - name: Write database .env
        run: echo "${{ secrets.DEV_VPS_ENV }}" > packages/database/.env

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Generate next-env.d.ts
        working-directory: apps/web
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n\n// NOTE: This file should not be edited\n// see https://nextjs.org/docs/app/api-reference/config/typescript for more information.\n' > next-env.d.ts

      - name: Type check
        run: npm run typecheck --workspace=@tiles-survive/web

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files to VPS
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "**/.next" \
            --exclude "**/dist" \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEV_VPS_APP_PATH }}/"

      - name: Install, migrate, build, restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export TURBO_TOKEN="${{ secrets.TURBO_TOKEN }}"
            export TURBO_TEAM="${{ secrets.TURBO_TEAM }}"

            cd "${{ secrets.DEV_VPS_APP_PATH }}"

            echo "${{ secrets.DEV_VPS_ENV }}" > .env
            echo "${{ secrets.DEV_VPS_ENV }}" > apps/web/.env
            echo "${{ secrets.DEV_VPS_ENV }}" > packages/database/.env

            npm run db:generate
            npm run db:migrate:deploy --workspace=@tiles-survive/database

            npm ci

            npm run build --workspace=@tiles-survive/web

            sudo /bin/systemctl restart "${{ secrets.DEV_SERVICE_NAME }}"
            sudo /bin/systemctl is-active "${{ secrets.DEV_SERVICE_NAME }}"
          ENDSSH
